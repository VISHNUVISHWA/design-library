name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            landing/package-lock.json

      - name: Build the app demo
        working-directory: app
        run: |
          npm ci
          npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /design-library/

      - name: Build the landing page
        working-directory: landing
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Assemble the site
        run: |
          mkdir -p site/landing
          cp -r app/web/dist/. site/
          cp -r landing/out/. site/landing/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
